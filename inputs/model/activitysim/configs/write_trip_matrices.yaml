CONSTANTS:
  time_periods:
    EA:
      first_hour: 0
      last_hour: 4
    AM:
      first_hour: 5
      last_hour: 8
    MD:
      first_hour: 10
      last_hour: 14
    PM:
      first_hour: 15
      last_hour: 17
    EV:
      first_hour: 18
      last_hour: 19
# Note that logic in write_trip_matrices_annotate_trips_prepocessor.yaml 
# adds all trips with hour > EV["last_hour"] to EA, to match 20to5 time period
# is_ea,"(trips.depart.between(time_periods['EA']['first_hour'], time_periods['EA']['last_hour'])) | (trips.depart > time_periods['EV']['last_hour'])